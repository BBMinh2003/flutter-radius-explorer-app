name: flutter_map_app
description: "Ứng dụng bản đồ OpenStreetMap."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.0          
  latlong2: ^0.9.1            
  geolocator: ^13.0.0          

  dio: ^5.7.0                 
  flutter_dotenv: ^5.2.0       

  flutter_bloc: ^8.1.6         
  get_it: ^8.0.0              

  isar: ^3.1.0+1              
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  image_path: "assets/road-map.png" 
  android: true 
  ios: true     